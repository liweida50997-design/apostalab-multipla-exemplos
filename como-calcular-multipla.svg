<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Como calcular uma múltipla</title><desc id="d">Odds 1,80, 1,75 e 1,80 resultam em 5,67. Com R$ 10,00 apostados, o retorno é R$ 56,70 e o lucro é R$ 46,70, se todas as seleções vencerem.</desc><rect width="960" height="470" rx="32" fill="#0c203a"/><g font-family="system-ui, sans-serif" fill="#fff"><text x="55" y="75" font-size="24" fill="#9bd8ff">APOSTALAB · EXEMPLO EDUCATIVO</text><text x="55" y="142" font-size="49" font-weight="700">Como calcular uma múltipla</text><text x="55" y="215" font-size="37">1,80 × 1,75 × 1,80 = 5,67</text><text x="55" y="277" font-size="34">R$ 10,00 × 5,67 = R$ 56,70 de retorno</text><text x="55" y="339" font-size="34">R$ 56,70 − R$ 10,00 = R$ 46,70 de lucro</text><text x="55" y="408" font-size="23" fill="#9bd8ff">Cenário em que todas as seleções vencem.</text></g></svg>
